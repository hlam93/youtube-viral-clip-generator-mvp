metadata:
  execution_id: EXE-0006
  title: Real deterministic scoring ensemble
  status: completed
  owners:
    - engineering
    - qa_security
    - orchestrator
  directive_refs:
    - DIR-0001
  last_updated: 2026-07-17

scope:
  objective: Replace heuristic scoring with a real deterministic scoring path using transcript emotion and Hume audio emotion while preserving current client contracts and bounded compute behavior.
  in_scope:
    - real transcript-emotion scorer integration with pinned model and version behavior
    - Hume Expression Measurement API integration for selected candidate windows
    - deterministic fusion using the existing viralScore formula, precision handling, tie-break order, and scoringConfigHash rules
    - Layer B audio cache and in-flight coalescing, plus minimal Layer C ensemble caching if needed for determinism or cost control
    - explicit degraded and failure behavior for Hume and transcript-emotion provider issues
    - regression coverage for determinism, provider failure modes, and score normalization
  out_of_scope:
    - discovery or transcript provider redesign
    - candidate windowing redesign
    - rendered fallback redesign
    - UI or UX changes beyond contract compatibility
    - multi-provider experimentation or non-deterministic ranking behavior

handoff:
  owners:
    orchestrator: DOE Orchestrator
    project_manager: DOE Project Manager
    ux_ui: N/A
    engineering: DOE Full Stack Delivery
    qa_security: DOE QA Security
    ci_enforcement: N/A
  acceptance_criteria:
    - Strict MVP scoring path no longer uses seeded or mock audio scoring or heuristic-only emotion scoring.
    - Same inputs plus same scoringConfigHash produce identical rounded component scores, selected top window IDs, and final ordering.
    - Hume calls are bounded by job caps, cached by window signature plus Hume config hash, and coalesced for duplicate in-flight work.
    - Missing or invalid Hume or transcript-emotion configuration fails closed; timeout, quota, or malformed payloads produce explicit degraded or failed job outcomes without hanging.
    - GET /jobs/{jobId} and GET /jobs/{jobId}/clips payload shapes remain unchanged while viralScore reflects real ensemble output.
    - Logs and metrics capture scoring-stage failures, cache behavior, and stage duration without leaking secrets or raw provider payloads.
  risk_tier: high
  risk_rationale: This slice adds external scoring dependencies, cost and quota risk, and determinism sensitivity to the MVP critical path.
  threat_or_abuse_assumptions:
    - missing or invalid provider configuration must not silently widen to mock behavior
    - repeated searches may attempt to force excessive Hume compute without proper caps and coalescing
    - malformed or out-of-range provider payloads must not poison cache or destabilize ranking
  validation_plan:
    engineering:
      - npm run build
      - npm test
      - unit coverage for score mapping, rounding, tie-break ordering, and scoringConfigHash behavior
      - integration coverage for Hume success, timeout, quota, malformed payload, and cache hit or coalescing behavior
    qa_security:
      - negative-path review for missing config, malformed provider payloads, quota, timeout, and no-silent-fallback behavior
      - secret-redaction review for scoring logs and provider error handling
    ci_enforcement:
      - N/A until CI expansion is requested
  release_gates:
    - deterministic golden-path tests are green
    - Hume and transcript-emotion failure and degraded behavior are proven
    - cache hash invalidation and coalescing behavior are verified
    - secrets and log redaction remain intact
    - API contracts remain unchanged
  rollback_expectation:
    - revert to the current deterministic heuristic scoring path in one deploy, preserving API schemas and job polling behavior, and invalidate any new scoring caches without data migration
  rollback_verified: true

