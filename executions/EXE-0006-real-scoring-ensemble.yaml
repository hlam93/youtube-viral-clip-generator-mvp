      - QA/security verified the slice with build passing and 30 of 30 tests passing, including strict fail-closed scoring config, Hume failure modes, deterministic scoring, and cache coalescing behavior.
      - Rollback verified via the heuristic scoring path remaining preserved and cache invalidation requiring no data migration (see validation.evidence).

backlog:
  items:
    - STORY-006-real-deterministic-scoring-ensemble
    - mvp-scoring-ensemble-slice
    - followup-env-runtime-loading-contract
  dependencies:
    - EXE-0001 through EXE-0005 completed on branch 2026/feat/mvp-foundation-app
    - approved transcript-emotion provider selection
    - Hume API runtime configuration

implementation:
  systems_touched:
    - scoring pipeline
    - Hume integration
    - transcript emotion integration
    - cache layers
    - logging
    - tests
  approach:
    - replace heuristic transcript/audio scoring with pinned provider-backed integrations
    - normalize and round all score components before selection and sorting
    - cache bounded Hume and ensemble outputs by deterministic keys
    - preserve current API shapes and explicit degraded behavior for provider failures
  preview:
    run_command: npm run dev
    verification: Real-provider scoring produces deterministic clip ordering or explicit degraded outcomes while existing search, polling, and clips contracts remain unchanged.
  deployment:
    free_host_provider: Vercel
    steps:
      - configure HUME_API_KEY and transcript-emotion provider settings in the host dashboard
      - run npm run build during deployment
      - verify scoring-stage happy path and degraded path after deploy
  rollback:
    - revert to the heuristic scoring implementation
    - redeploy without changing endpoint contracts

validation:
  engineering_checks:
    - build
    - deterministic scoring golden tests
    - Hume and transcript-emotion integration tests
  qa_checks:
    - repeated-run determinism scenarios
    - Hume timeout, quota, malformed payload, and transcript-emotion failure scenarios
    - API contract regression for search, job status, and clips endpoints
  security_checks:
    - no raw provider payload or secret leakage in logs or client responses
    - expensive-path caps and coalescing remain enforced under abuse scenarios
    - no silent fallback to mock scoring
  evidence:
    - npm run build -> pass
    - npm test -> pass (30/30 tests)
    - real Hume HTTP provider path implemented with explicit timeout, quota, malformed payload, and failure handling
    - transcript-emotion provider boundary is pinned, deterministic, and included in scoringConfigHash behavior
    - deterministic fusion, rounding, and stable tie-break ordering verified by regression coverage
    - Layer B audio cache and Layer C ensemble cache support deterministic keys, keyword isolation, and in-flight coalescing
    - missing or invalid scoring provider config fails closed with no silent fallback to mock scoring
    - scoring-stage logs emit cache stats, duration, and degraded or failure signals without leaking secrets or raw provider payloads

risk:
  residual_risks:
    - real-provider latency and quota may reduce clip yield or increase degraded outcomes
    - live Hume compatibility was validated through provider-path tests rather than a live upstream smoke run
    - unchanged windowing may limit quality improvements until a later slice
    - in-memory cache behavior still differs from production-scale deployment
    - npm scripts do not auto-load `.env`; local operators may assume `.env` is read unless runtime env injection or dotenv wiring is added in a follow-up slice
  release_recommendation: go-with-risk
