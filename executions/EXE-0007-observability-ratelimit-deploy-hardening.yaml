implementation:
  systems_touched:
    - job execution pipeline (stage timing, metrics logging)
    - cache layer accessor
    - rate limiter
    - deployment documentation
    - tests
  approach:
    - instrument job stage transitions with timestamps and derive per-stage durations
    - expose cache snapshot stats from the pipeline and compute per-job delta hit rates in the job store
    - emit a single job_metrics_summary structured log from every terminal job path
    - add a time-bounded sweep to the rate limiter, piggybacked on existing request handling, to evict expired bucket entries
    - correct README free-host deployment guidance to recommend Render/Railway first, given this MVP's in-memory state
  preview:
    run_command: npm run dev
    verification: Running a search job emits a job_metrics_summary log on completion (and on degraded/failure paths), rate-limit enforcement behaves identically to before, and bucket sizes observably shrink after the sweep interval elapses following a burst of one-off tokens.
  deployment:
    free_host_provider: Render or Railway (recommended); Vercel documented as usable only after adding an external store
    steps:
      - run npm run build during deployment
      - verify POST /search, GET /jobs/:jobId, and GET /jobs/:jobId/clips against the deployed instance
      - confirm job_metrics_summary log entries appear in host log output for completed jobs
  rollback:
    - revert the 5 changed files to their pre-slice state
    - redeploy without changing endpoint contracts or requiring data migration

validation:
  engineering_checks:
    - build
    - job_metrics_summary emission on all terminal job paths
    - cache delta hit-rate correctness
  qa_checks:
    - rate-limiter sweep bounds Map growth under sustained unique-token flooding (burst-before-first-sweep scenario reviewed)
    - no sensitive-data leakage in sweep or observability logs
    - existing per-IP/per-token rate-limit enforcement unchanged
    - README deployment claims technically accurate
  security_checks:
    - anonymous-token flood no longer grows rate-limit buckets forever
    - no raw IP/token/secret leakage in new log fields
    - sweep introduces no new background timer or denial vector
  evidence:
    - npm run build -> pass (no errors)
    - npm test -> pass (33/33 tests)
    - job_metrics_summary verified emitted on happy-path, zero-videos-degraded, and failure-catch terminal paths
    - rate-limiter sweep verified via dedicated test asserting bucket size stays bounded after a one-off token's window and the sweep interval both elapse
    - QA/Security independent review confirmed no sensitive-data leakage and no regression in existing rate-limit tests

risk:
  residual_risks:
    - rate-limit bucket growth is bounded to roughly a 5-minute sweep-interval window rather than the tighter 60-second rate-limit window; a very high-rate distinct-token flood can still cause a meaningful memory spike before the first (or between) sweep(s) fires; follow-up hardening (shorter interval, or a hard max-bucket-size/LRU cap) is not included in this slice
    - "Pre-existing, out-of-scope: recordAndCheck unconditionally appends to a key's timestamp array even once that key is already over its limit, so a single IP/token hammering the endpoint within one 60s window has no request-count cap, only time-based pruning; distinct vector from the one this slice targets, candidate for a future SEC-#### directive."
    - deltaHitRate can attribute a sliver of another concurrently-running job's cache hits/misses to a given job, since the pipeline's caches are shared across jobs and jobs are not serialized; accepted as a fast/cheap approximation rather than a defect
    - in-memory cache/rate-limit/job-store behavior still differs from a production-scale, multi-instance deployment; Vercel remains unusable for this MVP as-is until an external store is added
  release_recommendation: go-with-risk
