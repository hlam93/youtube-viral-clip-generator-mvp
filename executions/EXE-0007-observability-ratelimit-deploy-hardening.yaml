metadata:
  execution_id: EXE-0007
  title: Job observability, rate-limiter bucket eviction, and deploy-doc hardening
  status: completed
  owners:
    - engineering
    - qa_security
    - orchestrator
  directive_refs:
    - DIR-0001
  last_updated: 2026-07-17

scope:
  objective: Implement DIR-0001's quality.observability logging, close a rate-limiter anonymous-token DoS/memory-growth finding, and correct free-host deployment guidance to match this MVP's in-memory job store/cache/rate-limiter behavior.
  in_scope:
    - per-job stage-duration instrumentation and a job_metrics_summary structured log (stageDurationsMs, cacheHitRateLayerA, cacheHitRateLayerB, candidatesProcessed, renderedFallbackRate, jobCostProxyUnits) emitted on every terminal job path
    - pipeline cacheStats() accessor exposing transcript/audio/ensemble cache snapshotStats()
    - periodic sweep/eviction of expired rate-limit bucket entries (ipBucket/tokenBucket), piggybacked on existing request-driven calls, no new background timer
    - README free-host deployment section reorder (Render/Railway recommended ahead of Vercel) with accurate in-memory-state rationale
    - regression coverage for the rate-limiter sweep and job_metrics_summary fields
  out_of_scope:
    - CI wiring for npm test/npm run build in doe-governance.yml
    - UX/accessibility gate blanket-n/a handling across EXE records
    - stale metadata.owners field convention in EXE records
    - missing Dependabot/Renovate config
    - splitting the monolithic tests/pipeline.test.ts file
    - request-count-capping within a single rate-limit window (pre-existing, single-key spam vector; distinct from the many-distinct-token vector this slice targets)
    - discovery/candidate-windowing/rendered-fallback/scoring redesign, UI/UX changes, new dependencies, new endpoints

handoff:
  owners:
    orchestrator: DOE Orchestrator
    project_manager: DOE Project Manager
    ux_ui: N/A
    engineering: DOE Full Stack Delivery
    qa_security: DOE QA Security
    ci_enforcement: N/A
  acceptance_criteria:
    - job_metrics_summary log entry is emitted exactly once per job at completion and contains stageDurationsMs (per-stage object), cacheHitRateLayerA, cacheHitRateLayerB (both numbers in [0,1]), candidatesProcessed (number >= 0), renderedFallbackRate (number in [0,1]), and jobCostProxyUnits (number >= 0); no undocumented field (e.g. cacheHitRateLayerC) is present.
    - job_metrics_summary is emitted from every terminal job path (happy-path completion, zero-videos degraded early-return, and the failure catch), not only the happy path.
    - Cache hit-rate fields reflect each job's own delta against the shared pipeline cache (start-of-job vs end-of-job snapshot), not raw cumulative process-lifetime stats.
    - checkSearchRateLimit continues to enforce existing per-IP and per-token limits identically to pre-change behavior.
    - Expired rate-limit bucket entries for keys with no further requests are evicted from the in-memory Map after the sweep interval elapses on a subsequent request, bounding memory growth from one-off anonymous tokens.
    - The sweep is piggybacked on existing request-driven calls only; no new background timer/interval is introduced.
    - README.md deployment guidance accurately reflects that this MVP's job store, cache, and rate limiter are in-process memory, that Render/Railway's always-on single-container model preserves that state correctly across requests, and that Vercel's serverless model does not guarantee this without an external store this MVP does not yet have.
    - POST /search, GET /jobs/{jobId}, and GET /jobs/{jobId}/clips payload/status-code contracts are unchanged.
    - No sensitive data (raw IP, raw token, secrets) is newly logged by the sweep or the observability logging.
  risk_tier: high
  risk_rationale: This slice directly patches a rate-limiter DoS/memory-exhaustion finding on the authz/rate-limiting trust boundary of a security.scope business application (anonymous tokens are UUID-format-only with no server-side issuance, per src/requestSecurity.ts), in addition to production job-execution observability logging on the critical path. Reconciled with SYSTEM.md section 4 (business scope defaults medium-or-higher); high is used given the security-relevant nature of the fix.
  threat_or_abuse_assumptions:
    - an attacker can mint unlimited distinct UUID-format anonymous tokens (no server-side issuance/registration exists) and use them to flood the rate-limit tokenBucket Map with never-evicted keys, growing memory unbounded over time
    - observability logging must not leak raw IPs, raw tokens, or secrets into structured logs
    - the sweep/eviction mechanism must not itself become a performance regression or a new denial vector under concurrent request load
  validation_plan:
    engineering:
      - npm run build
      - npm test
      - review of all three job termination paths (happy path, zero-videos degrade, failure catch) for metrics-emission completeness
    qa_security:
      - independent verification that the sweep actually bounds Map growth under sustained unique-token flooding, including the burst-window-before-first-sweep scenario
      - log-content review for sensitive-data leakage in the sweep and job_metrics_summary logging
      - regression check against existing per-IP/per-token rate-limit enforcement tests
      - dedicated security_signoff verdict
    ci_enforcement:
      - N/A until CI expansion is requested
  release_gates:
    - npm run build and npm test are green
    - job_metrics_summary present and correctly computed on all terminal job paths
    - rate-limit allow/deny behavior unchanged from pre-slice behavior
    - no sensitive data introduced into logs
    - README deployment guidance technically accurate
  rollback_expectation:
    - revert src/jobs.ts, src/pipeline.ts, src/rateLimit.ts, README.md, and tests/pipeline.test.ts to their pre-slice state in one deploy; no data migration required since the sweep only affects in-memory Map contents and the observability log is additive
  rollback_verified: true

