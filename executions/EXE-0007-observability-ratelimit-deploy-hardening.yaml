  definition_of_ready:
    project_manager: pass
    ux_ui: n/a
    qa_security: pass
    ci_enforcement: n/a
    notes:
      - Scope confirmed bounded to the 5 drafted files; no scope creep against MISSION.md-only territory or the explicitly deferred items.
      - Backlog items and acceptance criteria drafted from DIR-0001's quality.observability list and the rate-limiter DoS finding.
  definition_of_done:
    engineering: pass
    project_manager: pass
    ux_ui: n/a
    qa_security: pass
    ci_enforcement: n/a
    security_signoff: pass
    orchestrator: pass
    notes:
      - Engineering review found and fixed a real defect in the original draft, job_metrics_summary was only emitted on the happy-path completion, silently dropping observability data for the zero-videos degraded early-return and the failure catch path. Fixed by extracting emission into a shared emitMetricsSummary helper called from all three terminal paths.
      - QA/Security independently verified the rate-limiter sweep genuinely closes the "grows forever, never evicted" defect, confirmed no sensitive-data leakage in the sweep or observability logging, confirmed no regression in existing rate-limit tests, and issued a pass security_signoff conditioned on residual risks being recorded (see risk.residual_risks) rather than silently dropped.
      - "Build and test evidence: npm run build succeeded with no errors; npm test 33/33 pass (see validation.evidence)."

