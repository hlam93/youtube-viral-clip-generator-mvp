  items:
    - STORY-007-job-observability-metrics
    - STORY-007-ratelimit-bucket-eviction
    - STORY-007-deploy-doc-hardening
  dependencies:
    - EXE-0001 through EXE-0006 completed on branch 2026/feat/mvp-foundation-app
